name: Playground (GitHub Pages)
# Deploys site/ + the current wheel to GitHub Pages.
# Needs: Settings → Pages → Source: "GitHub Actions". Runs on pushes to main
# that touch the package or the site, or by hand. (A `release` trigger runs on the
# tag ref, which the github-pages environment rejects by default.)
on:
  push:
    branches: [main]
    paths: ["src/**", "site/**", "scripts/build_site.sh", "examples/**", "pyproject.toml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --wheel && pip install dist/*.whl && bash scripts/build_site.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
