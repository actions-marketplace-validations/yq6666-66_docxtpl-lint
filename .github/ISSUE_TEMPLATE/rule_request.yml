name: Rule request
description: Propose a new deterministic check
labels: [rule-request]
body:
  - type: textarea
    id: problem
    attributes:
      label: Template mistake
      description: What do people write in the .docx, and what goes wrong?
    validations: { required: true }
  - type: textarea
    id: behaviour
    attributes:
      label: What docxtpl does
      description: Error message, or how the rendered output is wrong. Link upstream issues if any.
    validations: { required: true }
  - type: textarea
    id: detect
    attributes:
      label: How it could be detected without false positives
