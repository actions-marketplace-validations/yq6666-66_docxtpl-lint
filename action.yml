name: docxtpl-lint
description: Lint docxtpl (python-docx-template) Word templates and fail the build on errors
branding: { icon: file-text, color: blue }
inputs:
  files:
    description: Space-separated .docx paths or globs
    required: true
  args:
    description: Extra CLI args, e.g. "--data sample.json --warnings-as-errors"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: |
        shopt -s globstar nullglob
        docxtpl-lint ${{ inputs.args }} ${{ inputs.files }}
