[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docxtpl-lint"
version = "1.1.0"
description = "Static linter for docxtpl / python-docx-template Word templates: pinpoints errors to the table cell, CI-ready."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "docxtpl-lint contributors" }]
keywords = ["docxtpl", "python-docx-template", "jinja2", "docx", "word", "linter", "template", "ci", "json-schema"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["jinja2>=3.1", "lxml>=4.9", "tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
render = ["docxtpl>=0.18"]
dev = ["pytest>=8", "ruff>=0.6", "python-docx>=1.1", "docxtpl>=0.18", "rich>=13"]

[project.scripts]
docxtpl-lint = "docxtpl_lint.cli:main"

[project.urls]
Homepage = "https://github.com/yq6666-66/docxtpl-lint"

[tool.hatch.build.targets.wheel]
packages = ["src/docxtpl_lint"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs"]  # docs/deepseek-review.md holds verbatim model output

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
